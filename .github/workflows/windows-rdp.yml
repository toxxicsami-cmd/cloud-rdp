name: WINDOWS RDP - CLOUDFLARE

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "Override password (empty = use the RDP_PASSWORD Actions secret)"
        required: false
        default: ""
      session_minutes:
        description: "Session length in minutes (max 360 = 6h)"
        required: false
        default: "360"

permissions:
  contents: write
  actions: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force
          $listen = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue) { $listen = $true; break }
            Start-Sleep -Seconds 2
          }
          "RDP_LISTENER=$listen" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not $listen) {
            Write-Host "::error::RDP listener did not bind on 3389"
            exit 1
          }
          Write-Host "RDP enabled, NLA on, firewall open, listener bound"

      - name: Set RDP password
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD || inputs.rdp_password }}
        run: |
          if (-not $env:RDP_PASSWORD -or $env:RDP_PASSWORD.Length -lt 8) {
            Write-Host "::error::No password source - set the RDP_PASSWORD Actions secret"
            exit 1
          }
          $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $sec
          Write-Host "Password set for runneradmin (source not logged)"

      - name: Serve RDP session (tunnel + publish + monitor)
        shell: pwsh
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cf-tunnel.log"
          $err = "$log.err"
          $probeLog = Join-Path $env:RUNNER_TEMP "cf-probe.log"
          $probeErr = "$probeLog.err"
          $probePort = 13400
          $script:mainPid = 0

          function Start-Tunnel {
            # clean slate: kills any tunnel or probe client, starts a fresh tunnel
            Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            Remove-Item $log, $err -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "cloudflared" `
              -ArgumentList "tunnel","--url","tcp://localhost:3389" `
              -RedirectStandardOutput $log -RedirectStandardError $err `
              -WindowStyle Hidden -PassThru
            $script:mainPid = $p.Id
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 3
              $text = ""
              foreach ($f in @($log, $err)) {
                if (Test-Path $f) { $text += (Get-Content $f -Raw -ErrorAction SilentlyContinue) }
              }
              if ($text -match 'https://[a-z0-9-]+\.trycloudflare\.com') { return $Matches[0] }
            }
            return $null
          }

          function Start-AccessClient {
            param([string]$Url)
            # assumes clean slate (only the main tunnel runs) - never kills by name here
            $hn = $Url -replace '^https://',''
            Remove-Item $probeLog, $probeErr -ErrorAction SilentlyContinue
            Start-Process -FilePath "cloudflared" `
              -ArgumentList "access","tcp","--hostname",$hn,"--url","localhost:$probePort" `
              -RedirectStandardOutput $probeLog -RedirectStandardError $probeErr `
              -WindowStyle Hidden | Out-Null
            for ($i = 0; $i -lt 20; $i++) {
              if (Get-NetTCPConnection -LocalPort $probePort -State Listen -ErrorAction SilentlyContinue) { return $true }
              Start-Sleep -Seconds 1
            }
            return $false
          }

          function Send-RdpProbe {
            param([int]$Port)
            try {
              $pkt = [byte[]](0x03,0x00,0x00,0x13,0x0E,0xE0,0x00,0x00,0x00,0x00,0x00,0x01,0x00,0x08,0x00,0x03,0x00,0x00,0x00)
              $c = New-Object System.Net.Sockets.TcpClient
              $c.Connect("127.0.0.1", $Port)
              $s = $c.GetStream()
              $s.ReadTimeout = 8000
              $s.Write($pkt, 0, $pkt.Length)
              $buf = New-Object byte[] 256
              $n = $s.Read($buf, 0, 256)
              $c.Close()
              return ($n -ge 6 -and $buf[5] -eq 0xD0)
            } catch { return $false }
          }

          function Test-RdpLocal { Send-RdpProbe -Port 3389 }

          # full edge round-trip: runner -> Cloudflare edge -> tunnel -> runner:3389
          # this is the probe that catches "process alive but origin dead" (HTTP 530)
          function Test-TunnelChain { Send-RdpProbe -Port $probePort }

          function Publish {
            param([string]$Url, [string]$Status, [int]$Restarts, [string]$Debug)
            $u = $Url -replace '^https://',''
            $now = (Get-Date).ToUniversalTime()
            $payload = @(
              "TUNNEL_URL=$Url",
              "HOSTNAME=$u",
              "USERNAME=runneradmin",
              "LOCAL_PORT=13389",
              "RDP_LISTENER=$env:RDP_LISTENER",
              "RDP_SELFTEST=$script:selfTest",
              "CHAIN_SELFTEST=$script:chainTest",
              "TUNNEL_STATUS=$Status",
              "RESTARTS=$Restarts",
              "RUN_ID=$env:GITHUB_RUN_ID",
              "HEARTBEAT_UTC=$($now.ToString('o'))",
              "EXPIRES_UTC=$($now.AddMinutes([Math]::Min($script:minsRemaining, 360)).ToString('o'))",
              "DEBUG=$Debug"
            ) -join "`n"
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($payload))
            $body = @{ message = "session $env:GITHUB_RUN_ID $Status $(Get-Date -Format HHmmss)"; content = $b64; branch = "master" }
            $existing = gh api "/repos/$env:GITHUB_REPOSITORY/contents/session/tunnel-url.txt" 2>$null
            if ($LASTEXITCODE -eq 0 -and $existing) {
              $sha = ($existing | ConvertFrom-Json).sha
              if ($sha) { $body.sha = $sha }
            }
            $json = $body | ConvertTo-Json -Compress
            $json | gh api -X PUT "/repos/$env:GITHUB_REPOSITORY/contents/session/tunnel-url.txt" -H "Content-Type: application/json" --input - 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::publish failed (will retry on heartbeat)" }
          }

          function Get-ErrTail {
            $t = ""
            foreach ($f in @($err, $probeErr)) {
              if (Test-Path $f) {
                $last = (Get-Content $f -Tail 1 -ErrorAction SilentlyContinue)
                if ($last) { $t += ($last -replace '[=,]',' ') + " | " }
              }
            }
            return $t
          }

          # --- session budget: job timeout-minutes is 360 and includes setup,
          # so the serve loop must finish first or GitHub kills the job as
          # "cancelled" and the relay (success-only) never chains ---
          $script:minsRemaining = 355
          if ($env:SESSION_MINUTES -match '^\d+$') {
            $v = [int]$env:SESSION_MINUTES
            if ($v -ge 1 -and $v -le 355) { $script:minsRemaining = $v }
          }

          # --- bring tunnel + probe client up ---
          $url = Start-Tunnel
          if (-not $url) {
            Write-Host "::error::Tunnel URL never appeared"
            Publish -Url "none" -Status "TUNNEL_FAILED" -Restarts 0 -Debug (Get-ErrTail)
            exit 1
          }
          Write-Host "TUNNEL_URL=$url"
          $probeUp = Start-AccessClient -Url $url
          Write-Host "PROBE_CLIENT=$probeUp (port $probePort)"

          # --- prove both legs: direct RDP, and full chain through the edge ---
          Start-Sleep -Seconds 3
          $script:selfTest = Test-RdpLocal
          $script:chainTest = (Test-TunnelChain)
          Write-Host "RDP_SELFTEST=$($script:selfTest) CHAIN_SELFTEST=$($script:chainTest)"
          if (-not $script:chainTest) {
            Write-Host "::warning::chain probe failed at startup - monitor loop will recycle the tunnel"
          }

          $restarts = 0
          Publish -Url $url -Status "LIVE" -Restarts $restarts -Debug (Get-ErrTail)

          # --- banner ---
          $lines = @(
            "============================================",
            "  CLOUD RDP IS LIVE",
            "============================================",
            "  Tunnel URL : $url",
            "  Hostname   : $($url -replace '^https://','')",
            "  Username   : runneradmin",
            "  Password   : (from RDP_PASSWORD Actions secret - chat handover only)",
            "  RDP self-test: $($script:selfTest)  chain self-test: $($script:chainTest)",
            "  OS         : Windows Server 2022 (4 vCPU / 16 GB)",
            "============================================",
            "  CLIENT: cloudflared access tcp --hostname $($url -replace '^https://','') --url localhost:13389",
            "  then mstsc /v:localhost:13389",
            "============================================"
          )
          $lines | ForEach-Object { Write-Host $_ }
          Write-Host "::notice title=Cloud RDP URL::$url user=runneradmin"

          @"
          # Cloud RDP ready

          | Field | Value |
          |---|---|
          | Tunnel | ``$url`` |
          | Username | ``runneradmin`` |
          | Password | in Actions secret ``RDP_PASSWORD`` (handover in chat) |
          | RDP self-test | ``$($script:selfTest)`` |
          | Chain self-test | ``$($script:chainTest)`` |
          | Local port | ``13389`` |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # --- monitor loop: three failure modes, three responses ---
          #   1. main tunnel process dead (by PID, not name)  -> recycle
          #   2. process alive but edge round-trip fails 2x   -> recycle (the 530 case)
          #   3. direct RDP probe fails                       -> restart TermService
          $start = Get-Date
          $deadline = $start.AddMinutes($script:minsRemaining)
          $lastBeat = Get-Date
          $lastChainCheck = Get-Date
          $chainFails = 0
          Write-Host "Session live until $deadline ($($script:minsRemaining) min)"

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            $script:minsRemaining = [Math]::Max(1, [int]($deadline - (Get-Date)).TotalMinutes)

            # 1. main tunnel process (exact PID)
            $mainAlive = $null -ne (Get-Process -Id $script:mainPid -ErrorAction SilentlyContinue)
            $needRecycle = $false
            $recycleReason = ""
            if (-not $mainAlive) {
              $needRecycle = $true
              $recycleReason = "main tunnel process dead"
            }

            # 2. chain health every 60s
            if (-not $needRecycle -and ((Get-Date) - $lastChainCheck).TotalSeconds -ge 60) {
              $lastChainCheck = Get-Date
              if (Test-TunnelChain) {
                if ($chainFails -gt 0) { Write-Host "$(Get-Date -Format HH:mm:ss) chain recovered" }
                $chainFails = 0
                $script:chainTest = $true
              } else {
                $chainFails++
                $script:chainTest = $false
                Write-Host "$(Get-Date -Format HH:mm:ss) chain probe FAILED ($chainFails/2)"
                # distinguish: is RDP itself down, or only the tunnel?
                if (-not (Test-RdpLocal)) {
                  Write-Host "$(Get-Date -Format HH:mm:ss) direct RDP also down - restarting TermService"
                  Restart-Service TermService -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 5
                }
                if ($chainFails -ge 2) {
                  $needRecycle = $true
                  $recycleReason = "edge round-trip dead (origin 530) while process alive"
                }
              }
            }

            if ($needRecycle) {
              $restarts++
              $chainFails = 0
              Write-Host "$(Get-Date -Format HH:mm:ss) RECYCLE #$restarts - $recycleReason"
              $newUrl = Start-Tunnel
              if ($newUrl) {
                $url = $newUrl
                Start-AccessClient -Url $url | Out-Null
                Start-Sleep -Seconds 3
                $script:selfTest = Test-RdpLocal
                $script:chainTest = Test-TunnelChain
                Write-Host "TUNNEL_URL=$url (restart #$restarts) chain=$($script:chainTest)"
                Publish -Url $url -Status "RESTARTED" -Restarts $restarts -Debug (Get-ErrTail)
              } else {
                Write-Host "::error::tunnel recycle failed"
                Publish -Url $url -Status "TUNNEL_DEAD" -Restarts $restarts -Debug (Get-ErrTail)
              }
              $lastBeat = Get-Date
              $lastChainCheck = Get-Date
              continue
            }

            # 3. heartbeat every 5 min
            if (((Get-Date) - $lastBeat).TotalMinutes -ge 5) {
              $beat = (Get-Date -Format 'HH:mm:ss')
              Write-Host "$beat active - restarts=$restarts chainFails=$chainFails left=$($script:minsRemaining)min"
              Publish -Url $url -Status "LIVE" -Restarts $restarts -Debug (Get-ErrTail)
              $lastBeat = Get-Date
            }
          }

          Publish -Url $url -Status "SESSION_ENDED" -Restarts $restarts -Debug (Get-ErrTail)
          Write-Host "Session budget spent - run will complete"
